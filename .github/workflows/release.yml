name: Generate and Attach Release Assets

on:
  release:
    types: [published]

jobs:
  process-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.COMMITTER_TOKEN }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run italicizer script
      run: node scripts/italicize.js andromeda.json

    - name: Commit generated files
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "chore: add files generated by italicize.js for release ${{ github.event.release.tag_name }}" || echo "No changes to commit"
        git push

    - name: Upload assets to release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          themes/*.json
        token: ${{ secrets.COMMITTER_TOKEN }}

    - name: Publish extension to the Zed registry
      uses: huacnlee/zed-extension-action@v2
      with:
        extension-name: andromeda
        push-to: ChocolateNao/extensions
      env:
        COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}