name: Generate Release, Upload Assets, Publish Extension

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  process-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.COMMITTER_TOKEN }}
        ref: ${{ github.event.release.target_commitish || github.ref_name }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run italicizer script
      run: node scripts/italicize.js andromeda.json

    - name: Commit generated files
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add .
        git commit -m "chore: add files generated by italicize.js for release ${{ github.event.release.tag_name }}" || echo "No changes to commit"
        git push origin HEAD:${{ github.event.release.target_commitish || "master" }}
      env:
        GITHUB_TOKEN: ${{ secrets.COMMITTER_TOKEN }}

    - name: Upload assets to release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          themes/*.json
        token: ${{ secrets.COMMITTER_TOKEN }}

    - name: Publish extension to the Zed registry
      uses: huacnlee/zed-extension-action@v2
      with:
        extension-name: andromeda
        push-to: ChocolateNao/extensions
      env:
        COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}